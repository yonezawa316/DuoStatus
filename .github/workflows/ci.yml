name: Build and check

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  universal:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show existing toolchain
        run: xcrun swiftc --version
      - name: Build both architectures
        run: ./scripts/build.sh
      - name: Run focused tests on the native architecture
        run: ./scripts/test.sh
      - name: Validate package
        run: ./scripts/package.sh

# No certificate, credential, publishing permission, or automatic Release upload.
# Paid app packages are validated on the runner, not uploaded as public artifacts.
# These jobs check native logic on two runners, not the macOS 13 support floor.
